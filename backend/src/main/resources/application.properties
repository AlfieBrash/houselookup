server.port=${PORT:8081}

app.os-places.endpoint=https://api.os.uk/search/places/v1/postcode
app.os-places.api-key=${APP_OS_PLACES_API_KEY:}

app.epc.endpoint=https://epc.opendatacommunities.org/api/v1/domestic/search
app.epc.api-key=${APP_EPC_API_KEY:}
app.epc.username=${APP_EPC_USERNAME:}

app.flood-monitoring.endpoint=https://environment.data.gov.uk/flood-monitoring/id/floods
app.flood-monitoring.search-radius-km=${APP_FLOOD_SEARCH_RADIUS_KM:5}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

# Auth/session cookies
app.auth.cookie-name=pp_session
app.auth.cookie-ttl-days=${APP_AUTH_COOKIE_TTL_DAYS:14}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${APP_AUTH_COOKIE_SAME_SITE:Lax}

# Payment settings
app.payment.package-config=${APP_PAYMENT_PACKAGES:1:500,5:1200,10:2000}
app.payment.currency=GBP
app.payment.frontend-url=${APP_PAYMENT_FRONTEND_URL:${VITE_FRONTEND_URL:http://localhost:8080}}
app.payment.success-url=${APP_PAYMENT_SUCCESS_URL:${app.payment.frontend-url}/checkout/success}
app.payment.cancel-url=${APP_PAYMENT_CANCEL_URL:${app.payment.frontend-url}/checkout/cancel}
app.payment.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payment.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/houselookup}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Report token settings
app.report.legacy-download-enabled=${APP_REPORT_LEGACY_DOWNLOAD_ENABLED:true}
app.report.token-ttl-minutes=${APP_REPORT_TOKEN_TTL_MINUTES:15}
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
